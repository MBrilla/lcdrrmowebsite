<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Top GOVPH Banner -->
  <rect width="1200" height="42" fill="#0e274a" />
  <text x="35" y="26" fill="#ffffff" font-size="13" font-weight="bold" letter-spacing="1">GOVPH &#8226; REPUBLIC OF THE PHILIPPINES &#8226; DEPARTMENT OF SCIENCE AND TECHNOLOGY</text>
  <text x="1165" y="26" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="end">DOST-PAGASA OFFICIAL IEC PUBLICATION</text>

  <!-- Masthead -->
  <rect y="42" width="1200" height="110" fill="#7a1313" />
  <text x="40" y="75" fill="#fecaca" font-size="12" font-weight="bold" letter-spacing="1.5">LIPA CITY DISASTER RISK REDUCTION AND MANAGEMENT OFFICE (LCDRRMO)</text>
  <text x="40" y="118" fill="#ffffff" font-size="30" font-weight="bold">Color-Coded Heavy Rainfall &amp; Flood Warning System</text>
  <text x="1160" y="80" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="end">OFFICIAL SOURCE: DOST-PAGASA</text>
  <text x="1160" y="105" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="end">bagong.pagasa.dost.gov.ph</text>
  <text x="1160" y="130" fill="#f8fafc" font-size="11" text-anchor="end">24/7 Operations: (043) 756-0127</text>

  <!-- Sub-header -->
  <rect y="152" width="1200" height="45" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="40" y="180" fill="#334155" font-size="15" font-weight="bold">Public Weather Information &amp; Community Flood Evacuation Decision Protocol</text>
  <text x="1160" y="180" fill="#7a1313" font-size="14" font-weight="bold" text-anchor="end">Category: Meteorological &amp; Hydrological Hazards</text>

  <!-- Explanatory intro box -->
  <rect x="40" y="215" width="1120" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="60" y="243" fill="#0f172a" font-size="14" font-weight="bold">Standard Overview &amp; Mandate:</text>
  <text x="60" y="268" fill="#475569" font-size="13">Adopted under Republic Act 10121 from the DOST-PAGASA Hydrometeorological Division. This color scheme determines school class suspensions,</text>
  <text x="60" y="270" fill="#475569" font-size="13">pre-emptive evacuation in low-lying river barangays of Lipa City, and emergency alert activation by BDRRMC command posts.</text>

  <!-- Level 1: RED WARNING -->
  <g transform="translate(40, 305)">
    <rect width="1120" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" />
    <rect width="240" height="150" rx="10" fill="#dc2626" />
    <text x="120" y="60" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">RED</text>
    <text x="120" y="90" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">WARNING</text>
    <text x="120" y="118" fill="#fecaca" font-size="13" font-weight="bold" text-anchor="middle">&gt; 30 mm / hour</text>

    <!-- Details -->
    <text x="270" y="42" fill="#991b1b" font-size="18" font-weight="bold">Torrential Rainfall &#8226; EVACUATION IS MANDATORY</text>
    <text x="270" y="70" fill="#1e293b" font-size="14"><tspan font-weight="bold">Precipitation Volume:</tspan> More than 30 mm rain observed in 1 hour, or continuous rain &gt; 65 mm in 3 hours.</text>
    <text x="270" y="95" fill="#1e293b" font-size="14"><tspan font-weight="bold">Flood Threat:</tspan> Severe, catastrophic river flooding and extensive urban street inundation is occurring or imminent.</text>
    <text x="270" y="125" fill="#dc2626" font-size="14" font-weight="bold">&#8226; ACTION: Immediate evacuation to assigned barangay evacuation centers or designated multi-level shelters.</text>
  </g>

  <!-- Level 2: ORANGE WARNING -->
  <g transform="translate(40, 475)">
    <rect width="1120" height="150" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" />
    <rect width="240" height="150" rx="10" fill="#ea580c" />
    <text x="120" y="60" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">ORANGE</text>
    <text x="120" y="90" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">WARNING</text>
    <text x="120" y="118" fill="#fed7aa" font-size="13" font-weight="bold" text-anchor="middle">15 – 30 mm / hour</text>

    <!-- Details -->
    <text x="270" y="42" fill="#c2410c" font-size="18" font-weight="bold">Intense Rainfall &#8226; PREPARE TO EVACUATE</text>
    <text x="270" y="70" fill="#1e293b" font-size="14"><tspan font-weight="bold">Precipitation Volume:</tspan> 15 to 30 mm rain observed in 1 hour and expected to persist for the next 2 hours.</text>
    <text x="270" y="95" fill="#1e293b" font-size="14"><tspan font-weight="bold">Flood Threat:</tspan> Flooding is threatening low-lying communities, riverbanks (Malaking Tubig river tributaries), and depressions.</text>
    <text x="270" y="125" fill="#ea580c" font-size="14" font-weight="bold">&#8226; ACTION: Alert family members, secure 72-hour Go Bags, transfer valuables upstairs, and stand by for evacuation siren.</text>
  </g>

  <!-- Level 3: YELLOW WARNING -->
  <g transform="translate(40, 645)">
    <rect width="1120" height="150" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5" />
    <rect width="240" height="150" rx="10" fill="#ca8a04" />
    <text x="120" y="60" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">YELLOW</text>
    <text x="120" y="90" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">WARNING</text>
    <text x="120" y="118" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="middle">7.5 – 15 mm / hour</text>

    <!-- Details -->
    <text x="270" y="42" fill="#854d0e" font-size="18" font-weight="bold">Heavy Rainfall &#8226; MONITOR WEATHER ADVISORIES</text>
    <text x="270" y="70" fill="#1e293b" font-size="14"><tspan font-weight="bold">Precipitation Volume:</tspan> 7.5 to 15 mm rain observed in 1 hour and expected to continue for the next 2 hours.</text>
    <text x="270" y="95" fill="#1e293b" font-size="14"><tspan font-weight="bold">Flood Threat:</tspan> Localized flooding is possible in low-lying barangays and poorly drained roadways.</text>
    <text x="270" y="125" fill="#854d0e" font-size="14" font-weight="bold">&#8226; ACTION: Regularly monitor official DOST-PAGASA weather bulletins and maintain contact with Lipa CDRRMO.</text>
  </g>

  <!-- Bottom Official Footer & Accreditation -->
  <rect y="820" width="1200" height="140" fill="#0f172a" />
  <text x="40" y="850" fill="#94a3b8" font-size="12" font-weight="bold">OFFICIAL CITATION &amp; ACCREDITATION:</text>
  <text x="40" y="872" fill="#ffffff" font-size="13">Sourced directly from the official Department of Science and Technology - Philippine Atmospheric, Geophysical and Astronomical Services Administration (DOST-PAGASA).</text>
  <text x="40" y="892" fill="#cbd5e1" font-size="12">Portal: https://bagong.pagasa.dost.gov.ph &#8226; Public Information Unit: piias@pagasa.dost.gov.ph &#8226; Republic Act No. 10121 Compliance.</text>
  
  <text x="1160" y="860" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">City Government of Lipa &#8226; CDRRMO Operations Center</text>
  <text x="1160" y="885" fill="#fef08a" font-size="14" font-weight="bold" text-anchor="end">24/7 HOTLINE: 0915-463-5005 &#8226; (043) 756-0127</text>
  <text x="1160" y="910" fill="#94a3b8" font-size="11" text-anchor="end">Authorized for public distribution and posting in all 72 Lipa Barangays</text>
</svg>
