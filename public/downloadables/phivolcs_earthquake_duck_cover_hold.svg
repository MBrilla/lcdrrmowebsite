<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Top GOVPH Banner -->
  <rect width="1200" height="42" fill="#0e274a" />
  <text x="35" y="26" fill="#ffffff" font-size="13" font-weight="bold" letter-spacing="1">GOVPH &#8226; REPUBLIC OF THE PHILIPPINES &#8226; DEPARTMENT OF SCIENCE AND TECHNOLOGY</text>
  <text x="1165" y="26" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="end">DOST-PHIVOLCS NSED OFFICIAL PUBLICATION</text>

  <!-- Masthead -->
  <rect y="42" width="1200" height="110" fill="#7a1313" />
  <text x="40" y="75" fill="#fecaca" font-size="12" font-weight="bold" letter-spacing="1.5">LIPA CITY DISASTER RISK REDUCTION AND MANAGEMENT OFFICE (LCDRRMO)</text>
  <text x="40" y="118" fill="#ffffff" font-size="30" font-weight="bold">Earthquake Preparedness &#8226; &#8220;Duck, Cover, and Hold&#8221;</text>
  <text x="1160" y="80" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="end">SOURCE: DOST-PHIVOLCS</text>
  <text x="1160" y="105" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="end">phivolcs.dost.gov.ph</text>
  <text x="1160" y="130" fill="#f8fafc" font-size="11" text-anchor="end">National Simultaneous Earthquake Drill</text>

  <!-- Sub-header -->
  <rect y="152" width="1200" height="45" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="40" y="180" fill="#334155" font-size="15" font-weight="bold">Standard Seismic Life-Saving Actions &#8226; Before, During, and After Shaking</text>
  <text x="1160" y="180" fill="#7a1313" font-size="14" font-weight="bold" text-anchor="end">Seismic Safety Drill Standard</text>

  <!-- 3 Big Action Steps -->
  <!-- Step 1: DUCK -->
  <g transform="translate(40, 215)">
    <rect width="355" height="340" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2" />
    <rect width="355" height="50" rx="10" fill="#dc2626" />
    <text x="177" y="32" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">1. DUCK! (DUMAPA)</text>
    
    <circle cx="177" cy="130" r="50" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
    <text x="177" y="138" fill="#dc2626" font-size="28" font-weight="bold" text-anchor="middle">DUCK</text>
    
    <text x="25" y="215" fill="#1e293b" font-size="14" font-weight="bold">Drop immediately to your hands and knees.</text>
    <text x="25" y="245" fill="#475569" font-size="13">&#8226; This protects you from being knocked off your feet by violent seismic S-waves.</text>
    <text x="25" y="290" fill="#475569" font-size="13">&#8226; Allows you to stay low and crawl toward sturdy shelter before debris falls.</text>
  </g>

  <!-- Step 2: COVER -->
  <g transform="translate(422, 215)">
    <rect width="355" height="340" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2" />
    <rect width="355" height="50" rx="10" fill="#2563eb" />
    <text x="177" y="32" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">2. COVER! (MAGTAGO)</text>
    
    <circle cx="177" cy="130" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text x="177" y="138" fill="#2563eb" font-size="24" font-weight="bold" text-anchor="middle">COVER</text>
    
    <text x="25" y="215" fill="#1e293b" font-size="14" font-weight="bold">Cover your head, neck, and torso.</text>
    <text x="25" y="245" fill="#475569" font-size="13">&#8226; Crawl underneath a sturdy desk, heavy table, or reinforced bench.</text>
    <text x="25" y="290" fill="#475569" font-size="13">&#8226; If no furniture is near, crouch against an interior wall covering head with arms.</text>
  </g>

  <!-- Step 3: HOLD ON -->
  <g transform="translate(805, 215)">
    <rect width="355" height="340" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2" />
    <rect width="355" height="50" rx="10" fill="#16a34a" />
    <text x="177" y="32" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">3. HOLD ON! (KUMAPIT)</text>
    
    <circle cx="177" cy="130" r="50" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="177" y="138" fill="#16a34a" font-size="26" font-weight="bold" text-anchor="middle">HOLD</text>
    
    <text x="25" y="215" fill="#1e293b" font-size="14" font-weight="bold">Hold on until shaking completely stops.</text>
    <text x="25" y="245" fill="#475569" font-size="13">&#8226; Grip table legs with both hands. Be prepared to shift with your shelter.</text>
    <text x="25" y="290" fill="#475569" font-size="13">&#8226; Stay under shelter until tremors stop completely. Do not panic or run.</text>
  </g>

  <!-- Post-Earthquake Evacuation Guide Box -->
  <g transform="translate(40, 575)">
    <rect width="1120" height="225" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="25" y="32" fill="#0f172a" font-size="16" font-weight="bold">WHAT TO DO ONCE THE SHAKING STOPS:</text>
    <text x="25" y="62" fill="#1e293b" font-size="13">&#8226; <tspan font-weight="bold">DO NOT USE ELEVATORS:</tspan> Electrical failures or misaligned shafts will trap occupants. Always take designated fire exit stairs.</text>
    <text x="25" y="90" fill="#1e293b" font-size="13">&#8226; <tspan font-weight="bold">CALMLY EVACUATE:</tspan> Walk, do not run or push. Protect your head with bags, notebooks, or hands while moving down stairs.</text>
    <text x="25" y="118" fill="#1e293b" font-size="13">&#8226; <tspan font-weight="bold">HEAD TO OPEN SPACES:</tspan> Move to barangay plazas, open football grounds, or parking lots far away from glass facades, trees, and power poles.</text>
    <text x="25" y="146" fill="#1e293b" font-size="13">&#8226; <tspan font-weight="bold">CHECK FOR GAS &amp; ELECTRICAL HAZARDS:</tspan> Turn off the main circuit breaker and LPG tank valves if safe. Do not light matches or candles.</text>
    <text x="25" y="174" fill="#1e293b" font-size="13">&#8226; <tspan font-weight="bold">EXPECT AFTERSHOCKS:</tspan> Aftershocks may trigger secondary collapse of already compromised structures. Await structural safety clearance from city engineers.</text>
  </g>

  <!-- Bottom Official Footer & Accreditation -->
  <rect y="820" width="1200" height="140" fill="#0f172a" />
  <text x="40" y="850" fill="#94a3b8" font-size="12" font-weight="bold">OFFICIAL SOURCE CITATION &amp; ACCREDITATION:</text>
  <text x="40" y="872" fill="#ffffff" font-size="13">Directly sourced and accredited from the DOST-PHIVOLCS Seismological Observation and Earthquake Prediction Division (SOEPD).</text>
  <text x="40" y="892" fill="#cbd5e1" font-size="12">Portal: https://phivolcs.dost.gov.ph &#8226; Standard curriculum for the National Simultaneous Earthquake Drill (NSED).</text>
  
  <text x="1160" y="860" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="end">City Government of Lipa &#8226; CDRRMO Emergency Operations Center</text>
  <text x="1160" y="885" fill="#fef08a" font-size="14" font-weight="bold" text-anchor="end">24/7 HOTLINE: 0915-463-5005 &#8226; (043) 756-0127</text>
  <text x="1160" y="910" fill="#94a3b8" font-size="11" text-anchor="end">Official Public Disaster Education (IEC) Poster</text>
</svg>
